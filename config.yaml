# 竞品监测配置文件 v2.0 - NativePet专用
# Apify真实爬虫方案 - 低成本可落地

monitoring:
  report_period: "2026-06"          # 报告周期: YYYY-MM
  output_dir: "./reports"           # 报告输出目录
  data_dir: "./data"                # 原始数据存储目录
  max_brands: 5                     # 最大监测品牌数
  language: "zh"                    # 报告语言: zh/en

brands:
  - name: "NativePet"
    website: "https://nativepet.com/"
    social_accounts:
      instagram: "nativepet"          # Instagram账号(不含@)
      tiktok: "nativepet"             # TikTok账号(不含@)
      facebook: "nativepet"           # Facebook主页名
      youtube: "@nativepet"           # YouTube频道
    facebook_page_url: "https://www.facebook.com/nativepet/"  # 用于Meta广告按Page抓取
    product_keywords:
      - "Native Pet"
      - "NativePet"
      - "NativePet Daily"
      - "NativePet Probiotic"
      - "NativePet Omega Oil"
      - "NativePet Hip Joint"
      - "NativePet Allergy"
      - "NativePet Pumpkin"
      - "NativePet Calm"
      - "NativePet Bone Broth"
    reddit_subreddits:               # 垂类subreddit(可选)
      - "dogs"
      - "DogSupplies"
      - "pethealth"
      - "dogcare"
      - "puppy101"

# Apify配置 (核心)
apify:
  api_token: "${APIFY_API_TOKEN}"   # 环境变量读取
  # Actor配置
  actors:
    instagram_profile: "apify/instagram-profile-scraper"
    instagram_posts: "apify/instagram-post-scraper"
    instagram_tagged: "scrapio/instagram-tagged-mentions-posts-scraper"
    instagram_comments: "apify/instagram-comment-scraper"
    tiktok_profile: "apify/tiktok-profile-scraper"
    youtube_scraper: "streamers/youtube-scraper"
    facebook_ads: "automation-lab/facebook-ads-library"
  # 采集参数
  max_posts_per_profile: 60         # 每个账号最多采集帖子数
  max_tagged_posts: 100             # Tagged区最多采集数
  max_ads_per_search: 100           # 每次广告搜索最多条数
  actor_timeout: 300                # Actor超时(秒)
  actor_poll_interval: 10           # Actor状态轮询间隔(秒)

# 请求配置
request:
  timeout: 30
  retry_times: 2
  delay_between_requests: 2
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

# 输出配置
output:
  format: "markdown"                # 报告格式: markdown
  include_raw_data: true            # 是否保存原始数据JSON
  include_cost_breakdown: true      # 是否包含成本明细
  language: "zh"                    # 报告语言

# 降级模式开关
fallback:
  use_search_fallback: true         # Apify失败时是否用搜索降级
  search_engine: "google"           # 搜索引擎: google/bing

# LLM分析配置
llm:
  content_classification: true      # 内容方向分类
  sentiment_analysis: true          # 情感分析
  selling_point_extraction: true    # 卖点提取
  script_analysis: true             # 视频脚本拆解
